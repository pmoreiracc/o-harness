name: Release
# Only the owner can start this workflow. The release App merges the version-only PR
# under main's normal checks; the remaining jobs test and publish its exact merge commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z); use the same version to retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Pedro on main, including reruns
        env:
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          [ "$GITHUB_REPOSITORY" = pmoreiracc/o-harness ] &&
          [ "$GITHUB_REF" = refs/heads/main ] &&
          [ "$ACTOR_ID" = 154069128 ] && [ "$TRIGGERING_ACTOR" = pmoreiracc ] || {
            echo "::error::Only Pedro may start or rerun Release, on main"; exit 1; }
  version:
    needs: authorize
    if: github.actor_id == '154069128' && github.triggering_actor == 'pmoreiracc'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - id: version
        name: Prepare version, wait for checks, and merge its PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: python3 .github/scripts/release.py
  # Pull requests run only part of the Windows suite; a release waits for all of it.
  windows:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    needs: version
    if: needs.version.outputs.tag
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash integrations/test.sh windows-full --shards 4 --shard "$TEST_SHARD"
        env:
          OH_TEST_WORKERS: '1'
          TEST_SHARD: ${{ matrix.shard }}
  # Builds the package and checks it installs and starts in the real apps; the release publishes an identical build.
  install:
    needs: version
    if: needs.version.outputs.tag
    permissions:
      contents: read
    uses: ./.github/workflows/install-check.yml
    with:
      ref: ${{ needs.version.outputs.commit }}
  release:
    needs: [version, windows, install]
    if: github.actor_id == '154069128' && github.triggering_actor == 'pmoreiracc'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The package published is built here, by this repository's code; the
      # artifact from the install check (whose jobs ran third-party npm code) only proves it is the one tested.
      # It goes outside the runner's temp folder, where the downloaded artifact can't write.
      - name: Build the package to publish
        run: |
          built="$(mktemp -d)/package"
          bash integrations/package.sh "$built"
          echo "BUILT=$built" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/tested
      - name: Check it is byte for byte the package the install check tested
        run: |
          [ "$(ls -A "$RUNNER_TEMP/tested")" = package.tgz ] || { echo "::error::The tested artifact holds more than package.tgz"; exit 1; }
          mkdir "$RUNNER_TEMP/checked" && tar -xzf "$RUNNER_TEMP/tested/package.tgz" -C "$RUNNER_TEMP/checked"
          diff -r "$BUILT" "$RUNNER_TEMP/checked"
      - name: Create the publishing token only after tests and package comparison
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure authenticated Git without saving the token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh auth setup-git
      - name: Create the tag, which pins this release to its commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-list -n1 "$TAG")" = "$COMMIT" ] || { echo "::error::Tag moved; refusing publication"; exit 1; }
          else
            git tag "$TAG" "$COMMIT" && git push origin "$TAG"
          fi
      - name: Publish the package to the dist branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          out="$RUNNER_TEMP/dist"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch origin dist
            published=$(git show FETCH_HEAD:claude/o-harness/core/revision.json | jq -r .version)
            python3 -c 'import sys; a,b=(tuple(map(int,v.split("."))) for v in sys.argv[1:]); sys.exit(a>b)' "$published" "${TAG#v}" || {
              echo "::error::Refusing to replace a newer published version"; exit 1; }
            # A retry after the package was published leaves it exactly as users received it.
            [ "$(git show FETCH_HEAD:claude/o-harness/core/revision.json | jq -r .version)" != "${TAG#v}" ] || {
              echo "dist already carries $TAG"; exit 0; }
            git worktree add -B dist "$out" FETCH_HEAD
            git -C "$out" rm -rq .
          else
            git worktree add --orphan -b dist "$out"
          fi
          cp -R "$BUILT/." "$out/"
          git -C "$out" add -A
          git -C "$out" diff --cached --quiet || git -C "$out" commit -qm "Release $TAG ($(git rev-parse --short "$COMMIT"))"
          git -C "$out" push origin dist
      - name: Create the GitHub release, with notes listing the merged pull requests
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
