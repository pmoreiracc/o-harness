name: release
# A new version reaching main releases it: "prepare release" opens the pull request that sets it (see
# docs/installation.md, "Releasing"). Nothing is published unless every job below passes. Run this workflow by
# hand only to retry a release that failed.
on:
  push:
    branches: [main]
    paths:
      - plugins/o-harness/.claude-plugin/plugin.json
      - plugins/o-harness/.codex-plugin/plugin.json
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Find the version to release
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Releases come from main"; exit 1; }
          version=$(jq -r .version plugins/o-harness/.claude-plugin/plugin.json)
          [ "$version" = "$(jq -r .version plugins/o-harness/.codex-plugin/plugin.json)" ] || {
            echo "::error::The Claude and Codex plugin versions differ"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
  # Pull requests run only part of the Windows suite; a release waits for all of it.
  windows:
    needs: version
    if: needs.version.outputs.tag
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash integrations/test.sh native
  # Builds the package and checks it installs and starts in the real apps; the release publishes that package.
  install:
    needs: version
    if: needs.version.outputs.tag
    uses: ./.github/workflows/install-check.yml
  release:
    needs: [version, windows, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: bash integrations/test.sh native
      - run: bash integrations/test.sh syntax
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}
      - name: Publish the checked package to the dist branch
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/dist"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch origin dist
            git worktree add -B dist "$out" FETCH_HEAD
            git -C "$out" rm -rq .
          else
            git worktree add --orphan -b dist "$out"
          fi
          tar -xzf "$RUNNER_TEMP/package.tgz" -C "$out"
          git -C "$out" add -A
          git -C "$out" diff --cached --quiet || git -C "$out" commit -qm "Release $TAG ($(git rev-parse --short HEAD))"
          git -C "$out" push origin dist
      - name: Create the tag and the GitHub release, with notes listing the merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
