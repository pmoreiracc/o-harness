name: install check
# Builds the package users will install and checks, on Windows, macOS and Linux, that it installs in the real
# Claude Code and Codex and that OH sets up and its tools start (integrations/install-check.py). The release runs
# it before publishing; run it by hand (Actions > install check) to try a branch. It needs no AI login.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build and check (the release's)
        type: string
        required: false
  workflow_dispatch:
# Read only, and no token saved in the checkouts: this installs third-party npm packages.
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the package users will install
        run: |
          bash integrations/package.sh "$RUNNER_TEMP/package"
          tar -czf "$RUNNER_TEMP/package.tgz" -C "$RUNNER_TEMP/package" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}
      - name: Install OH in both apps and check it starts
        run: |
          # Claude Code runs hooks with Git Bash on Windows.
          OH_CHECK_BASH=$(command -v bash)
          [ "$RUNNER_OS" != Windows ] || OH_CHECK_BASH=$(cygpath -w "$OH_CHECK_BASH")
          OH_CHECK_BASH="$OH_CHECK_BASH" python integrations/install-check.py "$RUNNER_TEMP/package.tgz"
