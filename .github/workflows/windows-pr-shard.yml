name: Windows PR shard
on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      shard:
        required: true
        type: number
    outputs:
      selection:
        description: Digest of the complete test ID assignment to both partitions
        value: ${{ jobs.tests.outputs.selection }}
jobs:
  tests:
    runs-on: windows-latest
    # Editing a shared test module can select nearly the full suite.
    timeout-minutes: 45
    outputs:
      selection: ${{ steps.windows.outputs.selection }}
    defaults:
      run:
        shell: bash
    steps:
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Run Windows partition
        id: windows
        env:
          WINDOWS_TEST_BASE: ${{ inputs.base }}
          OH_TEST_SHARD: ${{ inputs.shard }}
          OH_TEST_WORKERS: '4'
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          elapsed_start=$SECONDS
          result=0
          bash integrations/test.sh windows "$WINDOWS_TEST_BASE" | tee "$log" || result=$?
          if (( SECONDS - elapsed_start > 510 )); then
            echo "::warning::Windows partition used more than 8m 30s of test time"
          fi
          [ "$result" -eq 0 ] || exit "$result"
          digest=$(tr -d '\r' < "$log" | sed -n 's/^Windows selection digest \([0-9a-f]\{64\}\)$/\1/p')
          test -n "$digest"
          echo "selection=$digest" >> "$GITHUB_OUTPUT"
      - name: Show checkout changes after a test failure
        if: failure()
        run: git status --short --untracked-files=all
