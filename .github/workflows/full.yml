name: full suite
# Every test on Linux and Windows: nightly at 04:00 Brasília time (07:00 UTC) on main, and on demand.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        default: all
        options: [all, linux, windows, windows-pr-set, syntax]
      only:
        description: Optional name pattern, e.g. gates or test_crlf (runs only matching tests; ignored by syntax)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  linux:
    if: contains(fromJSON('["all","linux"]'), inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: bash integrations/test.sh native ${{ inputs.only && format('-k "{0}"', inputs.only) || '' }}
  syntax:
    if: contains(fromJSON('["all","syntax"]'), inputs.suite || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: bash integrations/test.sh syntax
  windows:
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ inputs.suite == 'windows-pr-set' && fromJSON('[0]') || fromJSON('[0,1,2,3]') }}
    if: contains(fromJSON('["all","windows","windows-pr-set"]'), inputs.suite || 'all')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - env:
          SUITE: ${{ inputs.suite }}
          ONLY: ${{ inputs.only }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          args=()
          [ -z "$ONLY" ] || args=(-k "$ONLY")
          if [ "$SUITE" = windows-pr-set ]; then
            bash integrations/test.sh windows origin/main "${args[@]}"
          else
            OH_TEST_WORKERS=1 bash integrations/test.sh windows-full --shards 4 --shard "$TEST_SHARD" "${args[@]}"
          fi
