name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [native, syntax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: bash integrations/test.sh "${{ matrix.suite }}"
      - name: Test release authorization and recovery
        if: matrix.suite == 'syntax'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
  # The full Windows suite is slow: a pull request runs the tests that can break on Windows,
  # and the full suite (full.yml) runs all of them nightly and on demand, as a release does.
  windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    # Most PRs take about 5 minutes; one that edits a test module most others import runs nearly all of them.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: bash integrations/test.sh windows "$WINDOWS_TEST_BASE"
        env:
          WINDOWS_TEST_BASE: origin/main
      - name: Show checkout changes after a test failure
        if: failure()
        run: git status --short --untracked-files=all
