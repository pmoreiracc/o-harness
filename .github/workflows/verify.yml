name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [native, syntax]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: bash integrations/test.sh "${{ matrix.suite }}"
  # The full Windows suite is slow: a pull request runs the tests that can break on Windows,
  # and the full suite (full.yml) runs all of them nightly and on demand, as a release does.
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: bash integrations/test.sh windows
