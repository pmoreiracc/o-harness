name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The full Windows suite is slow: it runs nightly and on demand, and a release waits for it.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [native, syntax]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: bash integrations/test.sh "${{ matrix.suite }}"
  windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # A pull request runs the tests that can break on Windows; nightly and on demand, all of them.
      - run: bash integrations/test.sh ${{ github.event_name == 'pull_request' && 'windows' || 'native' }}
