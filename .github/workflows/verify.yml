name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # GitHub can queue revisions out of order. Only coalesce duplicate runs of the same merge SHA.
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.sha) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [native, syntax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Run selected checks
        env:
          SUITE: ${{ matrix.suite }}
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$SUITE" = native ]; then
            bash integrations/test.sh pr "$TEST_BASE"
          else
            bash integrations/test.sh "$SUITE" "$TEST_BASE"
          fi
      - name: Test release authorization and recovery
        if: matrix.suite == 'syntax'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
  # The full Windows suite is slow: a pull request runs the tests that can break on Windows,
  # and the full suite (full.yml) runs all of them nightly and on demand, as a release does.
  windows-a:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # Editing a shared test module can select nearly the full suite.
    timeout-minutes: 45
    outputs:
      selection: ${{ steps.windows.outputs.selection }}
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_PARTITION: '0'
    # Both jobs use identical steps and the same pinned PR base.
    steps: &windows-test-steps
      # OH verifies exact bytes; keep the checkout and test repositories free of CRLF conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Run Windows partition
        id: windows
        env:
          WINDOWS_TEST_BASE: ${{ github.event.pull_request.base.sha }}
          OH_TEST_SHARD: ${{ env.WINDOWS_PARTITION }}
          OH_TEST_WORKERS: '4'
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          elapsed_start=$SECONDS
          result=0
          bash integrations/test.sh windows "$WINDOWS_TEST_BASE" | tee "$log" || result=$?
          if (( SECONDS - elapsed_start > 510 )); then
            echo "::warning::Windows partition used more than 8m 30s of test time"
          fi
          [ "$result" -eq 0 ] || exit "$result"
          digest=$(tr -d '\r' < "$log" | sed -n 's/^Windows selection digest \([0-9a-f]\{64\}\)$/\1/p')
          test -n "$digest"
          echo "selection=$digest" >> "$GITHUB_OUTPUT"
      - name: Show checkout changes after a test failure
        if: failure()
        run: git status --short --untracked-files=all
  windows-b:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # Editing a shared test module can select nearly the full suite.
    timeout-minutes: 45
    outputs:
      selection: ${{ steps.windows.outputs.selection }}
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_PARTITION: '1'
    steps: *windows-test-steps
  windows:
    # Retain one stable status check for the complete Windows selection.
    if: always() && github.event_name == 'pull_request'
    needs: [windows-a, windows-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          WINDOWS_A: ${{ needs['windows-a'].result }}
          WINDOWS_B: ${{ needs['windows-b'].result }}
          SELECTION_A: ${{ needs['windows-a'].outputs.selection }}
          SELECTION_B: ${{ needs['windows-b'].outputs.selection }}
        run: |
          test "$WINDOWS_A" = success
          test "$WINDOWS_B" = success
          test -n "$SELECTION_A"
          test "$SELECTION_A" = "$SELECTION_B"
